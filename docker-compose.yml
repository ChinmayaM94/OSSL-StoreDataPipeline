# Local dev backing services for ossl-store-pipeline: PostgreSQL, Kafka and MongoDB.
#
# Usage:
#   docker compose up -d        # start all services in the background
#   docker compose ps           # check status
#   docker compose logs -f      # tail logs
#   docker compose down         # stop + remove containers (keeps volumes)
#   docker compose down -v      # stop + remove containers AND volumes (wipe data)
#
# application.yml defaults already match these services, so no env overrides
# are needed: PostgreSQL localhost:5432 (db ossldb, user cmoo385 / postgres),
# Kafka localhost:9092, MongoDB localhost:27017/ossldb. The STORES and
# STORE_ADDRESS tables are created from create_tables.sql on the first start
# of an empty postgres volume (use `down -v` to re-run it).

services:
  postgres:
    image: postgres:15
    container_name: ossl-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ossldb
      POSTGRES_USER: cmoo385
      POSTGRES_PASSWORD: postgres
    volumes:
      - ossl-postgres-data:/var/lib/postgresql/data
      - ./create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmoo385 -d ossldb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.0
    container_name: ossl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mongodb:
    image: mongo:6
    container_name: ossl-mongo
    ports:
      - "27017:27017"
    volumes:
      - ossl-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  ossl-mongo-data:
  ossl-postgres-data: