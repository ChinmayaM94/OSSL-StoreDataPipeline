# Local dev backing services for ossl-store-pipeline. H2 (SQL) is in-memory
# and needs no container - only Kafka + MongoDB are provided here.
#
# Usage:
#   docker compose up -d        # start both services in the background
#   docker compose ps           # check status
#   docker compose logs -f      # tail logs
#   docker compose down         # stop + remove containers (keeps volumes)
#   docker compose down -v      # stop + remove containers AND volumes (wipe data)
#
# The app's application.yml already defaults to these exact hosts/ports
# (localhost:9092 for Kafka), so no KAFKA_BOOTSTRAP_SERVERS override is
# needed once this is up. NOTE: application.yml's spring.data.mongodb.uri
# currently points at a remote Azure Cosmos DB - override MONGODB_URI (or
# edit application.yml) to mongodb://localhost:27017/ossldb to use this
# local Mongo container instead.

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: ossl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mongodb:
    image: mongo:6
    container_name: ossl-mongo
    ports:
      - "27017:27017"
    volumes:
      - ossl-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  ossl-mongo-data: