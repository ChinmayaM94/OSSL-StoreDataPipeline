# Local dev backing services for ossl-store-pipeline: PostgreSQL, Kafka and MongoDB,
# plus monitoring: Prometheus (9090), Grafana (3000, admin/admin) and exporters.
#
# Usage:
#   docker compose up -d        # start all services in the background
#   docker compose ps           # check status
#   docker compose logs -f      # tail logs
#   docker compose down         # stop + remove containers (keeps volumes)
#   docker compose down -v      # stop + remove containers AND volumes (wipe data)
#
# application.yml defaults already match these services, so no env overrides
# are needed: PostgreSQL localhost:5432 (db ossldb, user cmoo385 / postgres),
# Kafka localhost:9092, MongoDB localhost:27017/ossldb. The STORES and
# STORE_ADDRESS tables are created from create_tables.sql on the first start
# of an empty postgres volume (use `down -v` to re-run it).

services:
  postgres:
    image: postgres:15
    container_name: ossl-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ossldb
      POSTGRES_USER: cmoo385
      POSTGRES_PASSWORD: postgres
    volumes:
      - ossl-postgres-data:/var/lib/postgresql/data
      - ./create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmoo385 -d ossldb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.7.0
    container_name: ossl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mongodb:
    image: mongo:6
    container_name: ossl-mongo
    ports:
      - "27017:27017"
    volumes:
      - ossl-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ossl-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ossl-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ossl-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Exporters (Kafka consumer lag, Postgres and Mongo health) scraped by Prometheus.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: ossl-kafka-exporter
    command: ["--kafka.server=kafka:9094"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ossl-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://cmoo385:postgres@postgres:5432/ossldb?sslmode=disable"
    depends_on:
      - postgres

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: ossl-mongodb-exporter
    command: ["--mongodb.uri=mongodb://mongodb:27017", "--collect-all", "--compatible-mode"]
    depends_on:
      - mongodb

volumes:
  ossl-grafana-data:
  ossl-mongo-data:
  ossl-postgres-data: