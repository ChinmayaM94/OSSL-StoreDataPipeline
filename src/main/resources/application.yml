server:
  port: 8080

spring:
  application:
    name: ossl-store-pipeline
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # PostgreSQL database connection
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ossldb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:cmoo385}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false
      open-in-view: false
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      properties:
        hibernate:
          format_sql: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ossldb}

# Custom application properties consumed by the producer/consumer services.
# Overridable via env vars for different environments (dev/qa/prod).
kafka:
  topic:
    store-events: ${STORE_EVENTS_TOPIC:ossl-store-events}
    change-events: ${CHANGE_EVENTS_TOPIC:ossl-store-change-events}
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:ossl-store-pipeline-group}
    sql-group-id: ${KAFKA_SQL_CONSUMER_GROUP_ID:ossl-store-sql-group}
    mongo-group-id: ${KAFKA_MONGO_CONSUMER_GROUP_ID:ossl-store-mongo-group}

# springdoc-openapi (Swagger) configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.safeway.ossl.storepipeline: INFO
    org.apache.kafka: WARN
