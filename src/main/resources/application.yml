server:
  port: 8080

spring:
  application:
    name: ossl-store-pipeline
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # H2 in-memory DB for local/dev - no external SQL server needed. Swap for
    # Postgres/MySQL in production via these four properties + the pom.xml driver.
    url: jdbc:h2:mem:ossldb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ossldb}

# Custom application properties consumed by the producer/consumer services.
# Overridable via env vars for different environments (dev/qa/prod).
kafka:
  topic:
    store-events: ${STORE_EVENTS_TOPIC:ossl-store-events}
    store-publication: ${STORE_PUBLICATION_TOPIC:ossl-store-publication}
    change-events: ${CHANGE_EVENTS_TOPIC:ossl-store-change-events}
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:ossl-store-pipeline-group}

# springdoc-openapi (Swagger) configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.safeway.ossl.storepipeline: INFO
    org.apache.kafka: WARN
